syntax = "proto3";

package FermaHub.Microservice;

enum HttpMethod {
  HTTP_METHOD_UNSPECIFIED = 0; 
  GET = 1;
  POST = 2;
  PUT = 3;
  DELETE = 4;
  PATCH = 5;
}


enum DataType {
  TYPE_RESULT_UNSPECIFIED = 0; 
  FILES = 1;
  TABLE = 2;
  TEXT = 3;
}

message Microservice {
    string id = 1; 
    string name = 2;
    repeated HttpMethod http_methods = 3; 
    DataType input_type = 4; 
    DataType type_result = 5; 
    string author = 6;
    string params = 7; 
    string description = 8;
    string notes = 9;
  }

