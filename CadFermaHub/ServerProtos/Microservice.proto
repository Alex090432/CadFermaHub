syntax = "proto3";

package CadFermaHub.MicroserviceServer;

import "SharedProtos/Enums.proto";

message Microservice {
    string id = 1; 
    string name = 2;
    repeated HttpMethod http_methods = 3; 
    DataType input_type = 4; 
    DataType type_result = 5; 
    string author = 6;
    string params = 7; 
    string description = 8;
    string notes = 9;
  }

